name: import-form
on:
  push:
    paths: ['.github/workflows/import-form.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          B=https://incomparable-speculoos-a0245a.netlify.app
          mkdir -p yoyaku/css yoyaku/js
          curl -fsSL "$B/" -o yoyaku/index.html
          curl -fsSL "$B/css/style.css" -o yoyaku/css/style.css
          curl -fsSL "$B/js/form.js" -o yoyaku/js/form.js
          ls -la yoyaku yoyaku/css yoyaku/js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yoyaku
          git commit -m "予約フォームの現行ファイルをNetlifyから取り込み"
          git push
