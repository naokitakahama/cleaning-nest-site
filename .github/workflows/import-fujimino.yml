name: import-fujimino
on:
  push:
    branches: [import-fujimino]
    paths: ['.github/workflows/import-fujimino.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          B=https://fujimino-otasuke.netlify.app
          mkdir -p fujimino
          curl -fsSL "$B/" -o fujimino/index.html
          curl -fsSL "$B/thanks.html" -o fujimino/thanks.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fujimino
          git commit -m "ふじみ野の依頼フォームをNetlifyから取り込み"
          git push
